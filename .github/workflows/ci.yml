name: ci

# Merge gate for the workspace: formatting, the source-size limit, clippy
# with warnings denied, the full test suite, the benchmark reporting tests,
# a bench smoke run, and the release binary size. Consumes zero untrusted
# input. Benchmarks with budgets run in bench.yml so a slow benchmark job
# never holds up test feedback.
#
# `lint` and `test` compile different targets (check vs test profile), so
# they run as two jobs rather than one serial list. `clippy` is its own job so
# that a source-size failure cannot skip it. The size job measures the static
# musl Linux release binary, the artifact that ci/release.sh checks against the
# 9 MB limit in ci/check-binary-size.sh.

on:
  push:
    branches: [main, bootstrap/evcore-initial-base]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt, source size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lint

      - name: fmt
        run: cargo fmt --all --check

      # The shell gate remains authoritative. Give the report its own step so
      # it can run and expose the complete file list when this gate fails.
      - name: source size
        id: source_size
        run: ./ci/check-source-size.sh

      - name: crate size audit
        if: ${{ !cancelled() && steps.source_size.outcome != 'skipped' }}
        run: python3 scripts/audit_crates.py --top 25

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: clippy

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test

      - name: test
        run: cargo test --workspace

      # Every benchmark parser and gate has its own tests; a broken parser
      # would otherwise fail (or pass) the bench job for the wrong reason.
      - name: benchmark reporting tests
        run: ./benchmarks/run_reporting_tests.sh

      # Compiles and runs every criterion bench once, as a test: proves the
      # bench targets still build and their setup code still runs.
      - name: bench (smoke)
        run: cargo bench --workspace -- --test

  size:
    name: release binary size (linux musl)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # cargo uses the toolchain pinned in rust-toolchain.toml, not the one
      # installed above, so the musl target is added to the pinned toolchain.
      # A failure here fails the job; there is no fallback to glibc.
      - name: linux musl target
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-musl

      # Zig is the C toolchain and linker for the static musl build. Pinned,
      # as in the release pipeline this gate was written for.
      - name: zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
          cache-key: x86_64-unknown-linux-musl

      - name: cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: build
        run: cargo zigbuild --release -p orcacode --target x86_64-unknown-linux-musl

      # The 9 MB limit in the script applies to *-linux-musl/* paths only.
      - name: release binary size
        run: ./ci/check-binary-size.sh target/x86_64-unknown-linux-musl/release/orcacode
